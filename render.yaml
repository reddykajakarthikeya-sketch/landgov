services:
  - type: web
    name: landgov-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.seed_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://reddykajakarthikeya-sketch.github.io
      - key: CORS_ORIGINS
        value: https://reddykajakarthikeya-sketch.github.io,https://reddykajakarthikeya-sketch.github.io/landgov,http://localhost:5173,http://127.0.0.1:5173
      # Optional: set DATABASE_URL if connecting a PostgreSQL instance
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: landgov-db
      #     property: connectionString

# Optional Render PostgreSQL service
# databases:
#   - name: landgov-db
#     plan: free
#     databaseName: landgov
#     user: landgov_user
