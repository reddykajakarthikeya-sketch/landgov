services:
  - type: web
    name: landgov-backend
    env: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://reddykajakarthikeya-sketch.github.io
      - key: CORS_ORIGINS
        value: https://reddykajakarthikeya-sketch.github.io,https://reddykajakarthikeya-sketch.github.io/landgov,http://localhost:5173,http://127.0.0.1:5173
